name: Domain safety CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check src tests tools
      - run: python -m mypy
